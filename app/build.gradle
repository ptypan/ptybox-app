plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.ptybox.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

// =============================================================================
// PtyBox - firma
//
// Upstream firma con 'testkey_untrusted.jks', una clave PUBLICA compartida con
// toda la comunidad. No la usamos: generamos la nuestra con
// scripts/gen_keystore.sh.
//
// La clave se lee de 'keystore.properties' (gitignored) o de variables de
// entorno, que es como GitHub Actions la inyecta desde los secrets. Si no hay
// ninguna de las dos, Gradle firma con la clave de depuracion estandar y lo
// avisa por consola.
// =============================================================================
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def keystorePropsLoaded = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    keystorePropsLoaded = true
}
def propOrEnv = { String key, String env ->
    if (keystorePropsLoaded && keystoreProps.containsKey(key)) return keystoreProps.getProperty(key)
    return System.getenv(env)
}
def ksStoreFile = propOrEnv("storeFile", "PTYBOX_STORE_FILE")
def ksStorePass = propOrEnv("storePassword", "PTYBOX_STORE_PASSWORD")
def ksKeyAlias = propOrEnv("keyAlias", "PTYBOX_KEY_ALIAS")
def ksKeyPass = propOrEnv("keyPassword", "PTYBOX_KEY_PASSWORD")
def hasReleaseSigning = ksStoreFile != null && ksStorePass != null && ksKeyAlias != null && ksKeyPass != null

if (!hasReleaseSigning) {
    logger.lifecycle("[PtyBox] No hay keystore configurado: se usara la clave de depuracion. " +
        "Los APKs NO serian instalables como actualizacion de una release firmada.")
}

android {
    namespace "com.ptybox"
    // F1B: el paquete Android es nuestro. El namespace de Java coincide con el
    // applicationId para que TermuxConstants.*_ACTIVITY_NAME / *_SERVICE_NAME
    // (que se derivan de TERMUX_PACKAGE_NAME) resuelvan a clases reales.
    applicationId "com.ptybox"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 1180
        versionName "0.118.0-ptybox1"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.ptybox"
        manifestPlaceholders.TERMUX_APP_NAME = "PtyBox"
        manifestPlaceholders.TERMUX_API_APP_NAME = "PtyBox:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "PtyBox:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "PtyBox:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "PtyBox:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "PtyBox:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "PtyBox:Widget"

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        // Upstream: storeFile file('testkey_untrusted.jks') con alias 'alias'.
        // PtyBox usa una clave propia creada por scripts/gen_keystore.sh.
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
            debug {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }

        debug {
            if (hasReleaseSigning) signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // F1B (PtyBox): este modulo ya no usa NDK. El bootstrap se carga desde
    // src/main/<abi>/assets/bootstrap-<abi>.zip (ver TermuxInstaller.loadZipBytes)
    // y el codigo nativo se elimino por completo de este modulo.

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("ptybox-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("ptybox-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
// =============================================================================
// PtyBox F1B - Bootstrap parcheado, servido desde assets por ABI.
//
// Ya no compilamos libtermux-bootstrap.so con el NDK: el zip del bootstrap se
// parchea fuera de Gradle y se coloca en src/main/<abi>/assets/. Asi el modulo
// app no necesita NDK y cada APK por ABI lleva solo su propio zip.
//
// El parcheo sustituye "com.termux" -> "com.ptybox" byte a byte. Es OBLIGATORIO
// que ambas cadenas midan lo mismo (10 caracteres), ver scripts/check_invariants.sh
// =============================================================================
task patchBootstraps {
    description = "Descarga, verifica y parchea el bootstrap de Termux hacia assets/<abi>/"
    group = "build setup"
    doLast {
        def packageVariant = project.ext.packageVariant
        def patcher = rootProject.file("scripts/patch_bootstrap.py")
        if (!patcher.exists())
            throw new GradleException("No se encuentra el parcheador: " + patcher)

        def env = [
            "PTYBOX_BOOTSTRAP_PACKAGE_VARIANT": packageVariant,
            "PTYBOX_BOOTSTRAP_OUTPUT_DIR": projectDir.absolutePath,
            "PTYBOX_BOOTSTRAP_CACHE_DIR"  : rootProject.file("build/ptybox-bootstrap-cache").absolutePath
        ]
        def proc = new ProcessBuilder(["python3", patcher.absolutePath])
        proc.environment().putAll(env)
        proc.inheritIO()
        proc.directory(rootProject.projectDir)
        def exitCode = proc.waitFor()
        if (exitCode != 0)
            throw new GradleException("patch_bootstrap.py fallo con codigo " + exitCode)
    }
}

clean {
    doLast {
        def tree = fileTree(projectDir)
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(patchBootstraps)
    }
}
